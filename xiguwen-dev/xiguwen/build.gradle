apply plugin: 'com.android.application'

android {
    namespace "com.linzi.xiguwen"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.linzi.xiguwen"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 300
        versionName "3.0.0"

//        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        /*ndk {
            abiFilters "armeabi", "armeabi-v7a", "x86", "mips","x86_64"
        }*/
//        flavorDimensions "default"
//        javaCompileOptions { annotationProcessorOptions { includeCompileClasspath = true } }
//        multiDexEnabled true


        manifestPlaceholders = [
                JPUSH_PKGNAME: "com.linzi.xiguwen",
                JPUSH_APPKEY : "042800c2cd392e61e77de677", //JPush上注册的包名对应的appkey.  042800c2cd392e61e77de677
                JPUSH_CHANNEL: "developer-default", //暂时填写默认值即可.
                qqappid      : "1111805433"
        ]

        ndk {
            //选择要添加的对应 cpu 类型的 .so 库。
//            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86', "x86_64"
            abiFilters 'arm64-v8a'
            // 还可以添加 'x86', 'x86_64', 'mips', 'mips64'
        }

    }

    signingConfigs {
        debug {
            storeFile file("qianlianxinxi.jks")
            storePassword "qianlian123456"
            keyAlias "chengdu_qianlian"
            keyPassword "qianlian123456"
        }
        release {
            storeFile file("qianlianxinxi.jks")
            storePassword "qianlian123456"
            keyAlias "chengdu_qianlian"
            keyPassword "qianlian123456"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

    }
    lintOptions {
        //lint 遇到 error 时继续 构建
        abortOnError false
        //build release 版本 时 开启lint 检测
        checkReleaseBuilds false
        // 防止在发布的时候出现因MissingTranslation导致Build Failed!
        disable 'MissingTranslation'
    }



    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

//    configurations.all { config ->
//        if (config.name.contains('UnitTest')) {
//            config.resolutionStrategy.eachDependency { details ->
//                if (details.requested.group == 'com.squareup.leakcanary' && details.requested.name == 'leakcanary-android') {
//                    details.useTarget(group: details.requested.group, name: 'leakcanary-android-no-op', version: details.requested.version)
//                }
//            }
//        }
//    }
}

configurations.all {
    resolutionStrategy {
        force 'com.google.errorprone:error_prone_annotations:2.15.0'
    }
}

